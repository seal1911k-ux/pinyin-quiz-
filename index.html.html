<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Hand-written 300 Vocab Trainer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pinyin-Pro CDN -->
    <script src="https://unpkg.com/pinyin-pro"></script>
    <!-- Font Inter & Noto Sans SC -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <style>
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- Header -->
    <header class="w-full max-w-xl text-center my-2">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500">
            初等手写汉字 (300 คำ)
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">สุ่มทายพินอิน & บันทึกคำที่ตอบถูกเพื่อไม่ให้สุ่มซ้ำ</p>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-xl bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-3xl p-5 sm:p-8 shadow-2xl flex flex-col items-center">

        <!-- Progress Bar & Counter Status -->
        <div class="w-full bg-slate-900/90 p-3 rounded-2xl border border-slate-700/80 mb-4 flex flex-col gap-2">
            <div class="flex justify-between items-center text-xs font-bold">
                <span class="text-emerald-400 flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    เขียนถูกแล้ว: <span id="done-count">0</span> / <span id="total-pool-count">300</span> คำ
                </span>
                <button onclick="resetCompleted()" class="text-[11px] text-slate-400 hover:text-teal-300 underline font-normal transition">
                    🔄 รีเซ็ตเริ่มสุ่มใหม่ทั้งหมด
                </button>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700/50">
                <div id="progress-bar" class="bg-gradient-to-r from-teal-400 to-emerald-400 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Mode Selector Switch -->
        <div class="w-full bg-slate-900/90 p-1.5 rounded-2xl border border-slate-700/80 flex gap-1 mb-5">
            <button id="mode-all" onclick="setMode('all')" class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 bg-teal-500 text-slate-950 shadow">
                คำที่ยังไม่ผ่านทั้งหมด
            </button>
            <button id="mode-starred" onclick="setMode('starred')" class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5">
                <span>⭐ เฉพาะติดดาว</span>
                <span id="star-count-badge" class="bg-amber-400/20 text-amber-300 text-[10px] px-2 py-0.5 rounded-full border border-amber-400/30">0</span>
            </button>
        </div>

        <!-- Flashcard Area -->
        <div class="w-full min-h-[260px] bg-slate-900/90 border border-slate-700 rounded-2xl p-6 flex flex-col items-center justify-center relative overflow-hidden shadow-inner">

            <!-- Star Toggle Button on Card -->
            <button id="btn-star-card" onclick="toggleCurrentStar()" class="absolute top-4 right-4 p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-500 transition duration-200 focus:outline-none" title="ติดดาวคำนี้เมื่อยังจำไม่ได้">
                <svg id="star-icon" class="w-6 h-6 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
            </button>

            <!-- Card Number -->
            <div id="card-num" class="absolute top-4 left-4 text-[11px] font-mono text-slate-500 bg-slate-800/50 px-2.5 py-1 rounded-lg border border-slate-700/50">
                #---
            </div>

            <!-- Pinyin Text (Show First) -->
            <div class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1 mt-2">พินอิน (Pinyin)</div>
            <div id="display-pinyin" class="text-4xl sm:text-5xl font-extrabold text-teal-300 tracking-wide transition-all duration-300 min-h-[60px] flex items-center justify-center">
                ---
            </div>

            <!-- Divider -->
            <div class="w-16 h-[2px] bg-slate-800 my-3"></div>

            <!-- Hanzi & Thai Meaning (Hidden by Default) -->
            <div id="hanzi-container" class="opacity-0 scale-95 transition-all duration-300 transform flex flex-col items-center">
                <div class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">เฉลย (Hanzi & ความหมาย)</div>
                <div id="display-hanzi" class="text-4xl sm:text-5xl font-extrabold text-amber-400">
                    ?
                </div>
                <div id="display-thai" class="text-sm sm:text-base text-slate-300 mt-2 font-medium bg-slate-800/80 px-3 py-1 rounded-lg border border-slate-700/60 text-center">
                    -
                </div>
            </div>

            <!-- Empty State Warning -->
            <div id="empty-state" class="hidden text-slate-300 text-center py-6">
                🎉 ยินดีด้วย! คุณจำคำศัพท์ในโหมดนี้ได้ครบหมดแล้ว<br>
                <button onclick="resetCompleted()" class="mt-3 px-4 py-2 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-xs rounded-xl transition">
                    กดปุ่มนี้เพื่อดึงคำทั้งหมดกลับมาสุ่มซ้ำอีกรอบ
                </button>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full mt-5">
            <!-- Phase 1: Reveal Button -->
            <div id="control-reveal" class="w-full">
                <button onclick="revealAnswer()" class="w-full py-3.5 px-4 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-100 font-semibold rounded-xl transition duration-200 shadow-md flex items-center justify-center gap-2">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    กดดูเฉลยตัวจีน
                </button>
            </div>

            <!-- Phase 2: Correct / Wrong Assessment Buttons (Show after reveal) -->
            <div id="control-eval" class="hidden w-full grid grid-cols-2 gap-3">
                <button onclick="markCard(false)" class="w-full py-3.5 px-4 bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/50 active:scale-95 text-rose-300 font-bold rounded-xl transition duration-200 flex items-center justify-center gap-2">
                    <span class="text-lg">❌</span> เขียนผิด (สุ่มซ้ำ)
                </button>
                <button onclick="markCard(true)" class="w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2">
                    <span class="text-lg">✅</span> เขียนถูก (เอาออก)
                </button>
            </div>
        </div>

        <!-- Vocab List Drawer -->
        <details class="w-full mt-6 text-slate-400 text-xs">
            <summary class="cursor-pointer hover:text-slate-200 transition py-1 text-center font-medium">
                ดูคลังคำศัพท์ทั้งหมด 300 คำ
            </summary>
            <div id="vocab-list" class="max-h-56 overflow-y-auto mt-2 space-y-1.5 p-2 bg-slate-900/60 rounded-xl border border-slate-700/50">
                <!-- List items rendered via JS -->
            </div>
        </details>

    </main>

    <!-- Footer -->
    <footer class="text-xs text-slate-500 my-3 text-center">
        初等手写汉字 (300个) Flashcard Quiz
    </footer>

        let vocabDatabase = [];
        let completedIds = []; // เก็บ ID ของคำที่เขียนถูกแล้ว
        let currentMode = 'all'; // 'all' หรือ 'starred'
        let currentCard = null;

        function initApp() {
            const savedStars = JSON.parse(localStorage.getItem('pinyin_starred_hanzi') || '[]');
            completedIds = JSON.parse(localStorage.getItem('pinyin_completed_ids') || '[]');

            vocabDatabase = rawVocabData.map((item) => {
                let py = '';
                if (typeof pinyinPro !== 'undefined') {
                    py = pinyinPro.pinyin(item.hanzi, { toneType: 'symbol' });
                }
                return {
                    id: item.id,
                    hanzi: item.hanzi,
                    thai: item.thai,
                    pinyin: py || '---',
                    starred: savedStars.includes(item.hanzi)
                };
            });

            updateProgress();
            renderVocabList();
            nextCard();
        }

        function saveState() {
            const starredItems = vocabDatabase.filter(item => item.starred).map(item => item.hanzi);
            localStorage.setItem('pinyin_starred_hanzi', JSON.stringify(starredItems));
            localStorage.setItem('pinyin_completed_ids', JSON.stringify(completedIds));
            updateProgress();
            renderVocabList();
        }

        function updateProgress() {
            const total = vocabDatabase.length;
            const done = completedIds.length;
            document.getElementById('done-count').innerText = done;
            document.getElementById('total-pool-count').innerText = total;

            const percentage = total > 0 ? (done / total) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            const starCount = vocabDatabase.filter(item => item.starred).length;
            document.getElementById('star-count-badge').innerText = starCount;
        }

        // รีเซ็ตคำที่เขียนถูกกลับมาสุ่มใหม่
        function resetCompleted() {
            if (confirm("คุณต้องการดึงคำศัพท์ทั้งหมดที่ผ่านแล้ว กลับมาสุ่มใหม่อีกครั้งใช่ไหม?")) {
                completedIds = [];
                saveState();
                nextCard();
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnAll = document.getElementById('mode-all');
            const btnStarred = document.getElementById('mode-starred');

            if (mode === 'all') {
                btnAll.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 bg-teal-500 text-slate-950 shadow";
                btnStarred.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5";
            } else {
                btnStarred.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 bg-amber-400 text-slate-950 shadow flex items-center justify-center gap-1.5";
                btnAll.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200";
            }

            nextCard();
        }

        function nextCard() {
            // ดึงเฉพาะคำที่ "ยังไม่ได้เขียนถูก"
            let activePool = vocabDatabase.filter(item => !completedIds.includes(item.id));

            if (currentMode === 'starred') {
                activePool = activePool.filter(item => item.starred);
            }

            if (activePool.length === 0) {
                document.getElementById('display-pinyin').innerText = '';
                document.getElementById('display-hanzi').innerText = '';
                document.getElementById('display-thai').innerText = '';
                document.getElementById('card-num').innerText = '#---';
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('hanzi-container').classList.add('opacity-0');
                document.getElementById('btn-star-card').classList.add('hidden');
                document.getElementById('control-reveal').classList.add('hidden');
                document.getElementById('control-eval').classList.add('hidden');
                currentCard = null;
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('btn-star-card').classList.remove('hidden');
            document.getElementById('control-reveal').classList.remove('hidden');
            document.getElementById('control-eval').classList.add('hidden');

            let randomIndex;
            if (activePool.length > 1) {
                do {
                    randomIndex = Math.floor(Math.random() * activePool.length);
                } while (currentCard && activePool[randomIndex].id === currentCard.id);
            } else {
                randomIndex = 0;
            }

            currentCard = activePool[randomIndex];

            document.getElementById('card-num').innerText = `#${currentCard.id}`;
            document.getElementById('display-pinyin').innerText = currentCard.pinyin;

            const hanziContainer = document.getElementById('hanzi-container');
            hanziContainer.classList.add('opacity-0', 'scale-95');
            document.getElementById('display-hanzi').innerText = '?';
            document.getElementById('display-thai').innerText = '-';

            updateCardStarIcon();
        }

        function revealAnswer() {
            if (!currentCard) return;
            document.getElementById('display-hanzi').innerText = currentCard.hanzi;
            document.getElementById('display-thai').innerText = currentCard.thai;

            const hanziContainer = document.getElementById('hanzi-container');
            hanziContainer.classList.remove('opacity-0', 'scale-95');

            // สลับปุ่มเป็น ถูก/ผิด
            document.getElementById('control-reveal').classList.add('hidden');
            document.getElementById('control-eval').classList.remove('hidden');
        }

        // กดปุ่ม ถูก หรือ ผิด
        function markCard(isCorrect) {
            if (!currentCard) return;

            if (isCorrect) {
                // ถ้าเขียนถูก ตัดออกจากคลังสุ่ม
                if (!completedIds.includes(currentCard.id)) {
                    completedIds.push(currentCard.id);
                }
                saveState();
            }

            // สุ่มคำถัดไปทันที
            nextCard();
        }

        function toggleCurrentStar() {
            if (!currentCard) return;
            currentCard.starred = !currentCard.starred;
            saveState();
            updateCardStarIcon();

            if (currentMode === 'starred' && !currentCard.starred) {
                nextCard();
            }
        }

        function toggleStarByIndex(index) {
            vocabDatabase[index].starred = !vocabDatabase[index].starred;
            saveState();
            if (currentCard && currentCard.id === vocabDatabase[index].id) {
                updateCardStarIcon();
            }
        }

        function updateCardStarIcon() {
            const btn = document.getElementById('btn-star-card');
            const icon = document.getElementById('star-icon');
            if (!currentCard) return;

            if (currentCard.starred) {
                icon.setAttribute('fill', 'currentColor');
                btn.className = "absolute top-4 right-4 p-2 rounded-xl bg-amber-400/10 border border-amber-400/40 text-amber-400 transition duration-200 focus:outline-none";
            } else {
                icon.setAttribute('fill', 'none');
                btn.className = "absolute top-4 right-4 p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-500 transition duration-200 focus:outline-none";
            }
        }

        function renderVocabList() {
            const container = document.getElementById('vocab-list');
            container.innerHTML = vocabDatabase.map((item, index) => {
                const isDone = completedIds.includes(item.id);
                return `
                <div class="flex justify-between items-center bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700/50 ${isDone ? 'opacity-40' : ''}">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-[10px] text-slate-500 w-6 font-mono shrink-0">#${item.id}</span>
                        <span class="text-amber-400 font-bold text-sm shrink-0">${item.hanzi}</span>
                        <span class="text-teal-300 font-mono text-xs shrink-0">${item.pinyin}</span>
                        <span class="text-slate-300 text-xs truncate">(${item.thai})</span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        ${isDone ? '<span class="text-[10px] text-emerald-400 font-bold bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800">ผ่านแล้ว</span>' : ''}
                        <button onclick="toggleStarByIndex(${index})" class="p-1 ${item.starred ? 'text-amber-400' : 'text-slate-600 hover:text-slate-400'}">
                            ★
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
